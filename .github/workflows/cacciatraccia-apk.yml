name: Build Passione Funghi e Caccia 6.4.4 Play

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cacciatraccia/**'
      - '.github/workflows/cacciatraccia-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cacciatraccia/android-wrapper

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Validate v6.4.4 web app and Play rules
        working-directory: ${{ github.workspace }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const core = Array.from({length:25},(_,i)=>'cacciatraccia/v6/part'+String(i).padStart(2,'0')+'.txt');
          const parts = [...core, 'cacciatraccia/v6/part27.txt', 'cacciatraccia/v6/part28.txt', 'cacciatraccia/v6/part29.txt', 'cacciatraccia/v6/part30.txt'];
          const missing = parts.filter(p=>!fs.existsSync(p));
          if (missing.length) throw new Error('Missing parts: '+missing.join(', '));

          const src = parts.map(p=>fs.readFileSync(p,'utf8')).join('\n');
          new Function(src);

          const appLoader=fs.readFileSync('cacciatraccia/app-loader.js','utf8');
          const html=fs.readFileSync('cacciatraccia/index.html','utf8');
          const play=fs.readFileSync('cacciatraccia/v6/part27.txt','utf8');
          const main=fs.readFileSync('cacciatraccia/android-wrapper/app/src/main/java/com/cacciatraccia/italia/MainActivity.java','utf8');
          const manifest=fs.readFileSync('cacciatraccia/android-wrapper/app/src/main/AndroidManifest.xml','utf8');
          const gradle=fs.readFileSync('cacciatraccia/android-wrapper/app/build.gradle.kts','utf8');

          for (const id of ['quickMushroomBtn','quickSpeciesBtn','quickCarBtn','followBtn']) {
            if (!html.includes('id="'+id+'"')) throw new Error('Missing UI control '+id);
          }
          if (!appLoader.includes('part27.txt?v=6.4.4') || !appLoader.includes('part28.txt?v=6.4.4') || !appLoader.includes('part29.txt?v=6.4.4') || !appLoader.includes('part30.txt?v=6.4.4')) throw new Error('v6.4.4 modules not loaded');
          if (!play.includes('FREE_DAILY_EXTERNAL_SEARCHES=5')) throw new Error('Free quota missing');
          if (!play.includes('Passione PRO')) throw new Error('PRO UI missing');
          if (!fs.existsSync('cacciatraccia/privacy.html')) throw new Error('Privacy page missing');
          if (!main.includes('PRO_PRODUCT_ID = "passione_pro_annuale"')) throw new Error('Play Billing product missing');
          if (!main.includes('PendingPurchasesParams')) throw new Error('Billing pending purchase support missing');
          if (!manifest.includes('android:allowBackup="false"')) throw new Error('Backup hardening missing');
          if (manifest.includes('ACCESS_BACKGROUND_LOCATION')) throw new Error('Background location must not be requested');
          if (!gradle.includes('targetSdk = 36') || !gradle.includes('compileSdk = 36')) throw new Error('API 36 target missing');
          console.log('Web, quota, privacy, permissions and billing invariants: OK');
          NODE

      - name: Build release APK and AAB
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify APK identity
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -f "$APK"
          test -f "$AAB"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/pfc-badging.txt
          grep -F "package: name='com.cacciatraccia.italia' versionCode='6404' versionName='6.4.4'" /tmp/pfc-badging.txt
          cp "$APK" app/build/outputs/apk/release/Passione-Funghi-e-Caccia-v6.4.4-PLAY-UNSIGNED.apk
          cp "$AAB" app/build/outputs/bundle/release/Passione-Funghi-e-Caccia-v6.4.4-PLAY-UNSIGNED.aab
          cp /tmp/pfc-badging.txt app/build/outputs/apk/release/Passione-Funghi-e-Caccia-v6.4.4-badging.txt

      - name: Bundle signing tool
        run: |
          mkdir -p app/build/signing-tools/lib
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" app/build/signing-tools/apksigner
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" app/build/signing-tools/lib/apksigner.jar

      - uses: actions/upload-artifact@v4
        with:
          name: Passione-Funghi-e-Caccia-v6.4.4-PLAY-build
          path: |
            cacciatraccia/android-wrapper/app/build/outputs/apk/release/Passione-Funghi-e-Caccia-v6.4.4-PLAY-UNSIGNED.apk
            cacciatraccia/android-wrapper/app/build/outputs/bundle/release/Passione-Funghi-e-Caccia-v6.4.4-PLAY-UNSIGNED.aab
            cacciatraccia/android-wrapper/app/build/outputs/apk/release/Passione-Funghi-e-Caccia-v6.4.4-badging.txt
            cacciatraccia/android-wrapper/app/build/signing-tools/apksigner
            cacciatraccia/android-wrapper/app/build/signing-tools/lib/apksigner.jar
            cacciatraccia/privacy.html
            cacciatraccia/PLAYSTORE_PRIVACY_AND_DATA_SAFETY.md
          if-no-files-found: error
          retention-days: 30
