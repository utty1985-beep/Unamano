name: Build Passione Funghi e Caccia APK 6.3.0 FINAL
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cacciatraccia/**'
      - '.github/workflows/cacciatraccia-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cacciatraccia/android-wrapper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate final web app
        working-directory: ${{ github.workspace }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const parts = Array.from({length:25},(_,i)=>'cacciatraccia/v6/part'+String(i).padStart(2,'0')+'.txt');
          const missing = parts.filter(p=>!fs.existsSync(p));
          if (missing.length) throw new Error('Missing parts: '+missing.join(', '));
          const src = parts.map(p=>fs.readFileSync(p,'utf8')).join('\n');
          new Function(src);
          const html=fs.readFileSync('cacciatraccia/index.html','utf8');
          for (const id of ['quickMushroomBtn','quickSpeciesBtn','quickCarBtn','followBtn']) {
            if (!html.includes('id="'+id+'"')) throw new Error('Missing UI control '+id);
          }
          console.log('Final web app syntax and required controls: OK');
          NODE
      - name: Build release
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify package
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/cacciatraccia-badging.txt
          grep -F "package: name='com.cacciatraccia.italia' versionCode='6300' versionName='6.3.0'" /tmp/cacciatraccia-badging.txt
          cp "$APK" app/build/outputs/apk/release/Passione-Funghi-e-Caccia-v6.3.0-FINAL-UNSIGNED.apk
      - name: Bundle signing tools
        run: |
          mkdir -p app/build/signing-tools/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" app/build/signing-tools/apksigner
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" app/build/signing-tools/lib/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: Passione-Funghi-e-Caccia-v6.3.0-FINAL-build
          path: |
            cacciatraccia/android-wrapper/app/build/outputs/apk/release/Passione-Funghi-e-Caccia-v6.3.0-FINAL-UNSIGNED.apk
            cacciatraccia/android-wrapper/app/build/signing-tools/apksigner
            cacciatraccia/android-wrapper/app/build/signing-tools/lib/apksigner.jar
          if-no-files-found: error
