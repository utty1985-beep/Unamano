name: Build Passione Funghi e Caccia 6.5.2 Stable Recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cacciatraccia/**'
      - '.github/workflows/cacciatraccia-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cacciatraccia/android-wrapper

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate exact stable web core
        working-directory: ${{ github.workspace }}
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const parts=Array.from({length:25},(_,i)=>'cacciatraccia/v6/part'+String(i).padStart(2,'0')+'.txt');
          const missing=parts.filter(p=>!fs.existsSync(p));
          if(missing.length) throw new Error('Missing stable parts: '+missing.join(', '));
          const src=parts.map(p=>fs.readFileSync(p,'utf8')).join('\n');
          new Function(src);
          const loader=fs.readFileSync('cacciatraccia/app-loader.js','utf8');
          const main=fs.readFileSync('cacciatraccia/android-wrapper/app/src/main/java/com/cacciatraccia/italia/MainActivity.java','utf8');
          const gradle=fs.readFileSync('cacciatraccia/android-wrapper/app/build.gradle.kts','utf8');
          if(!loader.includes('v=6.5.2')) throw new Error('Fresh 6.5.2 loader missing');
          if(!main.includes('?v=6502')) throw new Error('Android start URL 6502 missing');
          if(!gradle.includes('versionCode = 6502') || !gradle.includes('versionName = "6.5.2"')) throw new Error('Android identity mismatch');
          for(const forbidden of ['part27.txt','part28.txt','part29.txt','part30.txt','part31.txt','part32.txt','part33.txt']){
            if(loader.includes(forbidden)) throw new Error('Later unstable module loaded: '+forbidden);
          }
          console.log('Exact stable 6.3.4 core restored and syntax OK');
          NODE

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Verify APK identity
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/pfc-badging.txt
          grep -F "package: name='com.cacciatraccia.italia' versionCode='6502' versionName='6.5.2'" /tmp/pfc-badging.txt
          cp "$APK" app/build/outputs/apk/release/Passione-Funghi-e-Caccia-v6.5.2-STABLE-RECOVERY-UNSIGNED.apk
          cp /tmp/pfc-badging.txt app/build/outputs/apk/release/Passione-Funghi-e-Caccia-v6.5.2-badging.txt

      - name: Bundle signing tool
        run: |
          mkdir -p app/build/signing-tools/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" app/build/signing-tools/apksigner
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" app/build/signing-tools/lib/apksigner.jar

      - uses: actions/upload-artifact@v4
        with:
          name: Passione-Funghi-e-Caccia-v6.5.2-STABLE-RECOVERY-build
          path: |
            cacciatraccia/android-wrapper/app/build/outputs/apk/release/Passione-Funghi-e-Caccia-v6.5.2-STABLE-RECOVERY-UNSIGNED.apk
            cacciatraccia/android-wrapper/app/build/outputs/apk/release/Passione-Funghi-e-Caccia-v6.5.2-badging.txt
            cacciatraccia/android-wrapper/app/build/signing-tools/apksigner
            cacciatraccia/android-wrapper/app/build/signing-tools/lib/apksigner.jar
          if-no-files-found: error
          retention-days: 30
