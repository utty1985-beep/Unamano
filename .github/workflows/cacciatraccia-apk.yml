name: Build Passione Funghi e Caccia 6.9.9 Background

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cacciatraccia/android-wrapper/**'
      - '.github/workflows/cacciatraccia-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cacciatraccia/android-wrapper

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate Squadra modules
        working-directory: ${{ github.workspace }}
        run: |
          node --check cacciatraccia/friends-6.9.8-reconnect.js
          node --check cacciatraccia/team-6.9.8-reconnect.js
          node --check cacciatraccia/native-team-6.9.9.js
          node scripts/test-friends-reconnect-6.9.8.cjs
          node scripts/test-team-reconnect-6.9.8.cjs
          node scripts/test-native-team-background-6.9.9.cjs
          node scripts/test-team-background-6.9.9.cjs

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Verify APK identity
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/pfc-badging.txt
          grep -F "package: name='com.cacciatraccia.italia' versionCode='6909' versionName='6.9.9'" /tmp/pfc-badging.txt
          cp "$APK" app/build/outputs/apk/release/Passione-Funghi-e-Caccia-v6.9.9-BACKGROUND-UNSIGNED.apk
          cp /tmp/pfc-badging.txt app/build/outputs/apk/release/Passione-Funghi-e-Caccia-v6.9.9-badging.txt

      - name: Bundle signing tool
        run: |
          mkdir -p app/build/signing-tools/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" app/build/signing-tools/apksigner
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" app/build/signing-tools/lib/apksigner.jar

      - uses: actions/upload-artifact@v4
        with:
          name: Passione-Funghi-e-Caccia-v6.9.9-BACKGROUND-build
          path: |
            cacciatraccia/android-wrapper/app/build/outputs/apk/release/Passione-Funghi-e-Caccia-v6.9.9-BACKGROUND-UNSIGNED.apk
            cacciatraccia/android-wrapper/app/build/outputs/apk/release/Passione-Funghi-e-Caccia-v6.9.9-badging.txt
            cacciatraccia/android-wrapper/app/build/signing-tools/apksigner
            cacciatraccia/android-wrapper/app/build/signing-tools/lib/apksigner.jar
          if-no-files-found: error
          retention-days: 30
