name: Validate current Passione Funghi e Caccia

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated DOM test dependency
        run: npm install --prefix "$RUNNER_TEMP/pfc-qa" --no-audit --no-fund jsdom@26.1.0
      - name: Validate production entry point and historical regressions
        run: PFC_JSDOM_PATH="$RUNNER_TEMP/pfc-qa/node_modules/jsdom" node scripts/validate-pfc-current.cjs
