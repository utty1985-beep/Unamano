name: Validate Passione Funghi e Caccia Web

on:
  workflow_dispatch:
  push:
    paths:
      - 'cacciatraccia/**'
      - '.github/workflows/validate-pfc-web.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate active loader and concatenated JavaScript
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const active=[...Array.from({length:25},(_,i)=>i),27,28,29,30,32,33,34,35,36];
          const paths=active.map(i=>'cacciatraccia/v6/part'+String(i).padStart(2,'0')+'.txt');
          const missing=paths.filter(p=>!fs.existsSync(p));
          if(missing.length) throw new Error('Missing active files: '+missing.join(', '));
          const src=paths.map(p=>fs.readFileSync(p,'utf8')).join('');
          new Function(src);
          const loader=fs.readFileSync('cacciatraccia/app-loader.js','utf8');
          for(const i of [27,28,29,30,32,33,34,35,36]){
            if(!loader.includes(String(i))) throw new Error('Loader missing fix '+i);
          }
          for(const forbidden of ['part25.txt','part26.txt','part31.txt']){
            if(loader.includes(forbidden)) throw new Error('Unwanted module loaded: '+forbidden);
          }
          if(!loader.includes('v=6.6.5')) throw new Error('Loader cache version is not 6.6.5');
          const sw=fs.readFileSync('cacciatraccia/sw.js','utf8');
          new Function(sw);
          JSON.parse(fs.readFileSync('cacciatraccia/data/normativa-italia.json','utf8'));
          console.log('PASS: active PFC v6.6.5 syntax/order/data');
          NODE
