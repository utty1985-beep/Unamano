name: Validate Passione Funghi e Caccia Web

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate stable and tester tracks
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const core=[...Array.from({length:25},(_,i)=>i)];
          const fixes=[27,28,29,30,32,33,34,35];
          const read=i=>fs.readFileSync('cacciatraccia/v6/part'+String(i).padStart(2,'0')+'.txt','utf8');
          const stableSrc=core.map(read).join('');
          const testerSrc=[...core,...fixes].map(read).join('');
          new Function(stableSrc);
          new Function(testerSrc);
          const loader=fs.readFileSync('cacciatraccia/app-loader.js','utf8');
          if(!loader.includes("requestedVersion==='6611'")) throw new Error('Tester 6611 routing missing');
          if(!loader.includes("experimental?")) throw new Error('Tester/stable routing missing');
          if(!loader.includes("experimental?'6.6.4-test5-lazy':(gpsFixTester?'6.6.19-gpsfix':'6.5.2-r7')")) throw new Error('Stable/tester asset versions mismatch');
          if(!loader.includes("[27,28,29,30,32,33,34]")) throw new Error('Tester enhancements list mismatch');
          if(!loader.includes("part35.txt")) throw new Error('Lazy radar module missing');
          for(const forbidden of ['part25.txt','part26.txt','part31.txt']){if(loader.includes(forbidden))throw new Error('Unwanted module loaded: '+forbidden)}
          const sw=fs.readFileSync('cacciatraccia/sw.js','utf8');new Function(sw);
          if(!sw.includes('STABLE_CORE')||!sw.includes('ACTIVE_CORE'))throw new Error('Dual offline cache missing');
          JSON.parse(fs.readFileSync('cacciatraccia/data/normativa-italia.json','utf8'));
          console.log('PASS: stable 6.5.2-r7 default; GPS fix 6.6.19; tester radar lazy; syntax/order/data OK');
          NODE
