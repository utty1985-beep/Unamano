name: Notify IndexNow

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Submit UnaMano URLs to IndexNow
        run: |
          curl --fail --silent --show-error \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "utty1985-beep.github.io",
              "key": "87a6f9e9a2c6e96228181296db3e01b9",
              "keyLocation": "https://utty1985-beep.github.io/Unamano/87a6f9e9a2c6e96228181296db3e01b9.txt",
              "urlList": [
                "https://utty1985-beep.github.io/Unamano/",
                "https://utty1985-beep.github.io/Unamano/italia.html",
                "https://utty1985-beep.github.io/Unamano/foggia.html",
                "https://utty1985-beep.github.io/Unamano/come-funziona.html",
                "https://utty1985-beep.github.io/Unamano/faq.html",
                "https://utty1985-beep.github.io/Unamano/sicurezza.html",
                "https://utty1985-beep.github.io/Unamano/privacy.html",
                "https://utty1985-beep.github.io/Unamano/termini.html",
                "https://utty1985-beep.github.io/Unamano/segnala.html",
                "https://utty1985-beep.github.io/Unamano/sitemap.xml"
              ]
            }' \
            https://api.indexnow.org/indexnow
