name: Notify IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Submit UnaMano URL to IndexNow
        run: |
          curl --fail --silent --show-error \
            "https://api.indexnow.org/indexnow?url=https%3A%2F%2Futty1985-beep.github.io%2FUnamano%2F&key=87a6f9e9a2c6e96228181296db3e01b9&keyLocation=https%3A%2F%2Futty1985-beep.github.io%2FUnamano%2F87a6f9e9a2c6e96228181296db3e01b9.txt"
