name: Aggiorna fonti e aree ufficiali Puglia
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/check_pfc_regulations.py'
      - '.github/workflows/check-pfc-regulations.yml'
  schedule:
    - cron: '17 4 * * *'
permissions:
  contents: write
concurrency:
  group: puglia-official-data
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Controlla le fonti Puglia e scarica i confini ufficiali
        run: python scripts/check_pfc_regulations.py
      - name: Pubblica dati e stato delle fonti
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cacciatraccia/data/normativa-puglia.json cacciatraccia/data/aree-protette-puglia.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Aggiorna confini SIT e stato fonti Puglia"
          git push
