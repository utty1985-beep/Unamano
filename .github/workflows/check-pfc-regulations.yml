name: Check normative Passione Funghi e Caccia

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check official regulation sources
        run: python scripts/check_pfc_regulations.py
      - name: Commit source-state changes
        run: |
          if git diff --quiet -- cacciatraccia/data/normativa-italia.json; then
            echo "No changes to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cacciatraccia/data/normativa-italia.json
          git commit -m "Monitor official hunting and mushroom regulation sources"
          git push
