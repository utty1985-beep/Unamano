name: Build CacciaTraccia APK

on:
  push:
    paths:
      - 'android-cacciatraccia/**'
      - '.github/workflows/build-cacciatraccia-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install Android 35 SDK
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable APK
        working-directory: android-cacciatraccia
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp android-cacciatraccia/app/build/outputs/apk/debug/app-debug.apk CacciaTraccia-Italia-v6.1.7.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CacciaTraccia-Italia-v6.1.7
          path: CacciaTraccia-Italia-v6.1.7.apk
          if-no-files-found: error
          retention-days: 30
