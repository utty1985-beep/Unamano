name: Build CacciaTraccia APK

on:
  push:
    paths:
      - 'android-cacciatraccia/**'
      - '.github/workflows/build-cacciatraccia-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install Android 35 SDK
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        working-directory: android-cacciatraccia
        run: gradle :app:assembleRelease --stacktrace

      - name: Sign APK with v1 + v2 + v3 signatures
        shell: bash
        run: |
          set -euo pipefail
          PASS="$(openssl rand -hex 24)"
          KEYSTORE="$RUNNER_TEMP/cacciatraccia-release.keystore"
          keytool -genkeypair \
            -keystore "$KEYSTORE" \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -alias cacciatraccia \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=CacciaTraccia Italia, OU=Mobile, O=CacciaTraccia Italia, L=Foggia, ST=Puglia, C=IT"

          UNSIGNED="android-cacciatraccia/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/cacciatraccia-aligned.apk"
          FINAL="CacciaTraccia-Italia-v6.1.8-UNIVERSAL-SIGNED.apk"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$ZIPALIGN" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias cacciatraccia \
            --ks-pass "pass:$PASS" \
            --key-pass "pass:$PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$FINAL" \
            "$ALIGNED"

          "$APKSIGNER" verify --verbose --print-certs "$FINAL"

          printf '%s' "$PASS" > "$RUNNER_TEMP/signing-password.txt"
          zip -j CacciaTraccia-SIGNING-PRIVATE.zip "$KEYSTORE" "$RUNNER_TEMP/signing-password.txt"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: CacciaTraccia-Italia-v6.1.8-UNIVERSAL-SIGNED
          path: CacciaTraccia-Italia-v6.1.8-UNIVERSAL-SIGNED.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload private signing backup
        uses: actions/upload-artifact@v4
        with:
          name: CacciaTraccia-SIGNING-PRIVATE
          path: CacciaTraccia-SIGNING-PRIVATE.zip
          if-no-files-found: error
          retention-days: 30
