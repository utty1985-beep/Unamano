name: Build CacciaTraccia APK

on:
  push:
    paths:
      - 'android-cacciatraccia/**'
      - '.github/workflows/build-cacciatraccia-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install Android 35 SDK
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        working-directory: android-cacciatraccia
        run: gradle :app:assembleRelease --stacktrace

      - name: Align APK and export official signing tools
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED="android-cacciatraccia/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="CacciaTraccia-Italia-v6.1.9-ALIGNED-UNSIGNED.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$ALIGNED" > CacciaTraccia-zipalign-check.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$ALIGNED" > CacciaTraccia-apk-metadata.txt
          mkdir -p CacciaTraccia-signing-tools
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" CacciaTraccia-signing-tools/apksigner.jar

      - name: Upload aligned unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: CacciaTraccia-Italia-v6.1.9-ALIGNED-UNSIGNED
          path: |
            CacciaTraccia-Italia-v6.1.9-ALIGNED-UNSIGNED.apk
            CacciaTraccia-zipalign-check.txt
            CacciaTraccia-apk-metadata.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android signing tool
        uses: actions/upload-artifact@v4
        with:
          name: CacciaTraccia-Android-ApkSigner
          path: CacciaTraccia-signing-tools/apksigner.jar
          if-no-files-found: error
          retention-days: 30
