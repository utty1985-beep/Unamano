name: Deploy UnaMano to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cacciatraccia/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-manual"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Squadra Live controls
        run: |
          node scripts/test-team-runtime-6.9.2.cjs
          node scripts/test-wind-engine-6.9.3.cjs
          for name in app home friends team sw wind wind-engine dog; do node --check "cacciatraccia/${name}-6.9.3.js"; done
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
